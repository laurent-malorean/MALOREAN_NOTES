# Contrôle des dépendances : licences acceptées et failles connues (`cargo deny check`).

[graph]
# L'application ne vise que macOS : les dépendances Linux et Windows de Tauri ne comptent pas.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  # Copyleft limité au fichier modifié (dépendances HTML de Tauri) : compatible avec une application fermée.
  "MPL-2.0",
]

[licenses.private]
# Nos propres crates ne sont pas publiées.
ignore = true

[advisories]
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
