[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
api = { path = "crates/api" }
# Heure locale de l'horloge réelle (seule l'infrastructure la lit).
# Surveillance du dossier de la bibliothèque (changements faits hors de l'application).
notify-debouncer-mini = "0.6"
jiff = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = "2"
tauri-plugin-dialog = "2"
# Ouvrir une pièce jointe (PDF) avec l'application du Mac.
tauri-plugin-opener = "2"
# Décoder les en-têtes d'une pièce jointe envoyée par la page.
percent-encoding = "2"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = "12"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"
cognitive_complexity = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
missing_errors_doc = "deny"
fn_params_excessive_bools = "deny"
