[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
api = { path = "crates/api" }
# Heure locale de l'horloge réelle (seule l'infrastructure la lit).
# Surveillance du dossier de l'espace de travail (changements faits hors de l'application).
notify-debouncer-mini = "0.6"
jiff = "1"
# Imprimer l'interface en PDF par WebKit (fiche 0025), copier dans le presse-papiers (fiche 0027) ;
# déjà tirés par Tauri (wry), sur macOS.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSPasteboard", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }
proptest = "1"
# Index de chaque espace de travail (fiche 0028) : SQLite compilé avec l'application (`bundled`),
# recherche plein texte FTS5 comprise.
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = "2"
tauri-plugin-dialog = "2"
# Ouvrir une pièce jointe (PDF) avec l'application du Mac.
tauri-plugin-opener = "2"
# Décoder les en-têtes d'une pièce jointe envoyée par l'interface.
percent-encoding = "2"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = "12"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"
cognitive_complexity = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
missing_errors_doc = "deny"
fn_params_excessive_bools = "deny"
