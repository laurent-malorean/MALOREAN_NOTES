# Fabrication de l'application sur un Mac de GitHub, et dépôt du .dmg dans les Releases (doc/decisions/0083).
# Sur un tag vX.Y.Z : vérifie le numéro, fabrique le .dmg, crée la Release du tag et y joint le .dmg.
# À la demande (onglet Actions, « Run workflow »), sans tag : vérifie et fabrique, garde le .dmg comme artefact
# de l'exécution, ne crée aucune Release. Application non signée par Apple (aucun secret de signature).
# Même chaîne que scripts/essai-application.sh, sans ses options d'essai : interface par Vite, puis `tauri build`.
name: application

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    name: Numéro de version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      numero: ${{ steps.numero.outputs.numero }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Vérifier que le tag, Cargo.toml et ui/package.json portent le même numéro
        id: numero
        env:
          # Le tag seulement quand l'exécution vient d'un tag ; à la demande, Cargo.toml et package.json se comparent entre eux.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: echo "numero=$(scripts/version-coherente.sh "$TAG")" >> "$GITHUB_OUTPUT"

  fabriquer:
    name: Fabriquer le .dmg
    needs: verifier
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Installer Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Garder la compilation de Rust
        uses: Swatinem/rust-cache@v2.7.5
      - name: Installer Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Installer les dépendances de l'interface
        run: npm ci
        working-directory: ui
      - name: Construire l'interface
        # Écrit l'interface dans build/ui-dist (frontendDist de crates/app/tauri.conf.json).
        run: npm run build
        working-directory: ui
      - name: Construire l'application et le .dmg
        # Depuis la racine : Tauri ne trouve pas crates/app/tauri.conf.json depuis ui/. beforeBuildCommand est vidé :
        # l'interface vient d'être construite ci-dessus. Le programme annexe (assistant d'écriture, Swift) est
        # construit par crates/app/build.rs avec le swiftc du Mac.
        run: ui/node_modules/.bin/tauri build --bundles app,dmg --config '{"build":{"beforeBuildCommand":""}}'
      - name: Nommer le .dmg
        env:
          NUMERO: ${{ needs.verifier.outputs.numero }}
        run: |
          set -euo pipefail
          mkdir -p livraison
          dmg=$(find target/release/bundle/dmg -name '*.dmg' | head -n 1)
          [ -n "$dmg" ] || { echo "aucun .dmg fabriqué" >&2; exit 1; }
          cp "$dmg" "livraison/MALOREAN-Notes-${NUMERO}-aarch64.dmg"
          ls -l livraison
      - name: Joindre le .dmg à l'exécution
        uses: actions/upload-artifact@v4.4.3
        with:
          name: MALOREAN-Notes-dmg
          path: livraison/*.dmg
          if-no-files-found: error

  publier:
    name: Créer la Release
    needs: [verifier, fabriquer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Télécharger le .dmg
        uses: actions/download-artifact@v4.1.8
        with:
          name: MALOREAN-Notes-dmg
          path: livraison
      - name: Créer la Release du tag et y joindre le .dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NUMERO: ${{ needs.verifier.outputs.numero }}
        run: |
          set -euo pipefail
          gh release create "$TAG" livraison/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "MALOREAN Notes $NUMERO" \
            --notes "Application non signée : au premier lancement, clic droit sur l'application puis Ouvrir.

          Pour Mac avec puce Apple (Apple Silicon)."
