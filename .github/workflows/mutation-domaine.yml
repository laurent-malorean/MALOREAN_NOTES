# Test de mutation de la seule crate `domain`, chaque nuit (doc/decisions/0050, doc/code.md « Temps de la CI »).
# Même réglage que scripts/mutation-diff.sh : coupure des erreurs qui bouclent à 30 s, tests du seul domaine.
# Un survivant fait échouer le travail : GitHub envoie alors un e-mail.
name: mutation-domaine

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Installer Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-mutants
            target
          key: mutation-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-cargo-mutants-27.1.0
          restore-keys: mutation-${{ runner.os }}-
      - name: Installer cargo-mutants
        run: command -v cargo-mutants || cargo install --locked --version 27.1.0 cargo-mutants
      - name: Mutation du domaine
        # Codes de cargo-mutants : 0 tout attrapé, 2 survivant, 3 délais (avec ou sans survivant), 4 tests de base en échec.
        # Comme en local (scripts/ci.sh), le verdict se lit dans le bilan : seuls un survivant ou une erreur font échouer.
        run: |
          code=0
          cargo mutants --package domain --all-features --jobs 4 --timeout 30 --test-workspace=false -o out || code=$?
          json=out/mutants.out/outcomes.json
          [ -f "$json" ] || { echo "::error::aucun bilan (code $code)"; exit 1; }
          jq -c '{total: .total_mutants, caught, missed, timeout, unviable}' "$json"
          [ "$code" -le 3 ] && [ "$code" -ne 1 ] || { echo "::error::cargo-mutants a rendu le code $code"; exit 1; }
          missed=$(jq '.missed' "$json")
          [ "$missed" -eq 0 ] || { echo "::error::$missed survivant(s) :"; cat out/mutants.out/missed.txt; exit 1; }
          [ "$(jq '.timeout' "$json")" -eq 0 ] || { echo "::warning::erreurs qui bouclent :"; cat out/mutants.out/timeout.txt; }
      - name: Joindre le bilan
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: mutants-out
          path: out/mutants.out
          if-no-files-found: warn
