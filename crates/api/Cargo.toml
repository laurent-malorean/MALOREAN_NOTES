[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
application.workspace = true
serde.workspace = true
# Le protocole MCP des outils de l'application (JSON-RPC, fiche 0040).
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
percent-encoding.workspace = true
tracing.workspace = true
ts-rs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-web-kit.workspace = true

[dev-dependencies]
application = { workspace = true, features = ["testing"] }
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true

# Les menus du Mac ne se construisent que sur le fil principal du programme : ces tests tournent
# sans le lanceur de tests habituel, qui les mettrait chacun sur un autre fil.
[[test]]
name = "ipc_menu"
harness = false
